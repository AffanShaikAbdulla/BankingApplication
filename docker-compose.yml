services:
  # RabbitMQ (needed for Spring Cloud Bus)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eazybank
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server
  configserver:
    build: ./configserver
    image: shaik/configserver:s6
    container_name: configserver_ms
    ports:
      - "8071:8071"
    networks:
      - eazybank
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_RABBITMQ_HOST: rabbitmq

  # Accounts Microservice
  accounts:
    build: ./accounts
    image: shaik/accounts:s6
    container_name: accounts_ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - eazybank
    environment:
      SPRING_APPLICATION_NAME: accounts
      SPRING_PROFILES_ACTIVE: default
      CONFIG_SERVER_URL: http://configserver:8071
      SPRING_RABBITMQ_HOST: rabbitmq

  # Loans Microservice
  loans:
    build: ./loans
    image: shaik/loans:s6
    container_name: loans_ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - eazybank
    environment:
      SPRING_APPLICATION_NAME: loans
      SPRING_PROFILES_ACTIVE: default
      CONFIG_SERVER_URL: http://configserver:8071
      SPRING_RABBITMQ_HOST: rabbitmq

  # Cards Microservice
  cards:
    build: ./cards
    image: shaik/cards:s6
    container_name: cards_ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - eazybank
    environment:
      SPRING_APPLICATION_NAME: cards
      SPRING_PROFILES_ACTIVE: default
      CONFIG_SERVER_URL: http://configserver:8071
      SPRING_RABBITMQ_HOST: rabbitmq

networks:
  eazybank:
    driver: bridge