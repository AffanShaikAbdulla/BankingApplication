spring:
  application:
    name: accounts
  config:
    import: "optional:configserver:http://localhost:8888"  # Change port to 8888
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080

build:
  version: "3.0"

accounts:
  message: "Welcome to account related APIs"
  contactDetails:
    name: "shaik"
    onCallSupport: "6380378739"