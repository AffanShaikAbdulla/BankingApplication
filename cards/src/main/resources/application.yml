spring:
  application:
    name: cards

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:h2:mem:cardsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: "1.0"

cards:
  message: "Welcome to cards API"
  contactDetails:
    name: "Cards Support"
    email: "cards@fintech.com"
    onCallSupport: "8888888888"
